<main class="wrap"><div class="subhead"><span class="k">DOCTORS</span><h1>의료진</h1><p>진료 영역이 다른 원장 4명이 함께 진단하고, 한 분이 처음부터 끝까지 맡습니다. 경력 · 학회 표기는 예시입니다.</p></div><section style="padding-top:8px"><div id="dl"></div><div class="collab"><div class="box"><h3>함께 진단</h3><p style="margin:0;color:var(--sub)">임플란트 · 사랑니처럼 수술이 필요한 진료는 보철 원장과 구강외과 원장이 CT를 함께 봅니다.</p></div><div class="box"><h3>한 분이 끝까지</h3><p style="margin:0;color:var(--sub)">진단부터 마무리까지 같은 원장이 맡고, 바뀔 때는 미리 알려 드립니다.</p></div><div class="box"><h3>설명 먼저</h3><p style="margin:0;color:var(--sub)">치료 전에 사진 · 모형으로 상태를 보여 드리고 선택지를 설명합니다.</p></div></div><div class="next"><b>원장과 직접 상담하고 싶다면</b><a href="../visit/#consult">상담 신청 →</a></div></section></main>
