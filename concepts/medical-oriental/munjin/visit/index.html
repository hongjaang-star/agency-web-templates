<body data-page="visit" data-root="../">
<main id="main">
<section class="subhead bg-sheet"><div class="wrap"><p class="crumb"><a href="../">홈</a> · 오시는 길 · 상담</p><h1>오시는 길과 상담 신청</h1><p>화요일과 목요일은 저녁 8시 30분까지 진료합니다. 상담 신청은 꼭 필요한 항목만 받습니다.</p></div></section>
<section class="blk bg-paper" id="map"><div class="wrap">
  <div class="visit">
    <div><table class="hours" data-hours></table><p class="small">점심시간 13:00–14:00 · 접수는 진료 종료 30분 전 마감 · 교통사고 진료는 보험사 접수 번호를 알려 주세요.</p><ul class="ways" id="ways"></ul></div>
    <div><div class="map"><svg viewBox="0 0 600 360" role="img" aria-label="약도: 가온역 2번 출구에서 솔내로를 따라 약 4분, 솔내빌딩 3층"><rect width="600" height="360" fill="#fbf8f1"/><g stroke="#d8cfbd" stroke-width="22" fill="none"><path d="M0 250H600"/><path d="M180 0V360"/><path d="M430 0V360"/></g><g stroke="#24211c" stroke-width="1.5" fill="none" stroke-dasharray="3 5"><path d="M180 250H400V150"/></g><circle cx="180" cy="250" r="14" fill="#4f5d3a"/><text x="180" y="255" fill="#fff" font-size="13" text-anchor="middle" font-family="IBM Plex Sans KR">2</text><text x="200" y="290" font-size="15" fill="#24211c" font-family="IBM Plex Sans KR">가온역 2번 출구</text><rect x="370" y="96" width="70" height="54" fill="#24211c"/><circle cx="430" cy="96" r="12" fill="#b3361f"/><text x="352" y="80" font-size="17" fill="#24211c" font-family="Gowun Batang" font-weight="700">솔내빌딩 3층</text><text x="236" y="236" font-size="13" fill="#5f5a50" font-family="IBM Plex Sans KR">솔내로 · 도보 4분</text><text x="20" y="30" font-size="12" fill="#5f5a50" font-family="IBM Plex Sans KR">가상 약도 · 실제 위치 아님</text></svg></div><p class="small" data-addr></p></div>
  </div>
</div></section>
<section class="blk bg-sheet" id="consult"><div class="wrap">
  <div class="sec-head"><span class="no">상담 신청</span><div><h2>문진표와 함께<br>상담을 신청하세요.</h2><p>꼭 필요한 항목만 받습니다. 문진 내용은 선택이며, 넣으실 때만 건강 정보 처리에 따로 동의해 주세요. 데모라 실제로 접수되지 않습니다.</p></div></div>
  <form class="cf" id="cf" novalidate>
    <label class="f">이름<input type="text" name="name" autocomplete="name" required></label>
    <label class="f">연락처<input type="tel" name="tel" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" required></label>
    <label class="f">상담 방법<select name="how"><option>방문 상담</option><option>전화 상담</option></select></label>
    <label class="f">희망 시간대<select name="when"><option>평일 오전</option><option>평일 오후</option><option>화 · 목 야간</option><option>토요일 오전</option></select></label>
    <label class="f full">문진 내용 (선택)<textarea name="memo" placeholder="홈에서 문진표를 쓰면 자동으로 들어옵니다. 직접 적으셔도 됩니다."></textarea></label>
    <label class="agree full"><input type="checkbox" name="a1" required> <span>[필수] 상담 연락을 위한 개인정보(이름 · 연락처) 수집 · 이용에 동의합니다. 상담 후 1개월 뒤 파기합니다.</span></label>
    <label class="agree full"><input type="checkbox" name="a2"> <span>[선택] 문진 내용(건강 정보)을 상담 준비에만 쓰는 데 동의합니다. 동의하지 않으면 문진 내용은 보내지 않습니다.</span></label>
    <button class="btn" type="submit">상담 신청 (데모)</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div></section>
