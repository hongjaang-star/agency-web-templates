# main 에 push 하면 templates/ 의 모든 앱 + concepts/ 를 빌드해 GitHub Pages 로 배포
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build templates
        run: |
          REPO=/${{ github.event.repository.name }}
          mkdir -p _site
          # SITE_URL 은 도메인만. 앱의 absoluteUrl() 이 SITE_URL + BASE_PATH 로 조합한다
          for app in templates/*/*/; do
            [ -f "$app/package.json" ] || continue
            rel=${app#templates/}; rel=${rel%/}
            echo "::group::$rel"
            (cd "$app" && npm ci && NEXT_PUBLIC_NOINDEX=1 NEXT_PUBLIC_BASE_PATH="$REPO/$rel" NEXT_PUBLIC_SITE_URL="https://${{ github.repository_owner }}.github.io" npm run build)
            mkdir -p "_site/$rel" && cp -r "$app/out/." "_site/$rel/"
            echo "::endgroup::"
          done
      - name: Copy concepts + index
        run: |
          [ -d concepts ] && mkdir -p _site/concepts && cp -r concepts/. _site/concepts/
          node scripts/build-index.mjs
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
