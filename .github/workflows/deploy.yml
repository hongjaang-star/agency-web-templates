# main 에 push 하면 templates/ 의 모든 앱 + concepts/ 를 빌드해 GitHub Pages 로 배포
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site isolation
        run: node scripts/check-isolation.mjs
      - name: Validate site editor contracts
        run: node --test tests/editor-core.test.mjs
      - name: Build templates
        env:
          BASE_ROOT: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: bash scripts/build-sites.sh
      - name: Copy concepts + index
        env:
          BASE_ROOT: /${{ github.event.repository.name }}
        run: |
          [ -d concepts ] && mkdir -p _site/concepts && cp -r concepts/. _site/concepts/
          node scripts/install-concept-editors.mjs
          node scripts/build-index.mjs
          node scripts/build-agency.mjs
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
